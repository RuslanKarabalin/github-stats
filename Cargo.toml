[package]
name = "github-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A CLI tool to display GitHub profile statistics"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
comfy-table = "8.0.1"
console = "0.16.6"
dotenvy = "0.15.7"
futures = "0.3.34"
indicatif = "0.18.6"
minijinja = { version = "3.1.0", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
